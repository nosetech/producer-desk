[project]
name = "orchestrator"
version = "0.1.3"
description = "producer-desk オーケストレータ: GitHub Issuesポーリング・状態集約・Agent Runnerディスパッチ"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0",
]

[project.scripts]
orchestrator = "orchestrator.main:main"
ollama-bench = "orchestrator.ollama_bench:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
